<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitSphere - Gym & Management App</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel (Translates JSX to JS in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* Hide scrollbar for clean UI */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        /* Smooth transitions */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="bg-gray-200">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- MOCK DATA (Localized to Indian context) ---
        const INITIAL_CLASSES = [
            { id: 1, name: 'HIIT Burn', time: '06:00 AM', duration: '50 Min', spots: 5, totalSpots: 30, instructor: 'Rahul M.', type: 'Cardio', color: 'bg-orange-500' },
            { id: 2, name: 'Power Lifting', time: '07:00 AM', duration: '60 Min', spots: 0, totalSpots: 20, instructor: 'Priya S.', type: 'Strength', color: 'bg-purple-500' },
            { id: 3, name: 'Vinyasa Yoga', time: '08:30 AM', duration: '45 Min', spots: 12, totalSpots: 40, instructor: 'Neha R.', type: 'Flexibility', color: 'bg-teal-500' },
            { id: 4, name: 'Core Crusher', time: '05:30 PM', duration: '45 Min', spots: 8, totalSpots: 25, instructor: 'Vikram T.', type: 'Strength', color: 'bg-red-500' },
            { id: 5, name: 'Zumba Fiesta', time: '07:00 PM', duration: '60 Min', spots: 15, totalSpots: 50, instructor: 'Anjali G.', type: 'Dance', color: 'bg-pink-500' },
        ];

        const MOCK_MEMBERS = [
            { id: 'M001', name: 'Amit Kumar', plan: 'Pro Annual', expiry: '2026-12-01', status: 'Active', visits: 142 },
            { id: 'M002', name: 'Sneha Sharma', plan: 'Basic Monthly', expiry: '2026-05-10', status: 'Expiring Soon', visits: 12 },
            { id: 'M003', name: 'Rohan Patel', plan: 'Elite 6-Month', expiry: '2026-08-15', status: 'Active', visits: 67 },
            { id: 'M004', name: 'Kavya Singh', plan: 'Pro Annual', expiry: '2026-01-20', status: 'Expired', visits: 230 },
        ];

        function App() {
            const [viewRole, setViewRole] = useState('user'); // 'user' | 'admin'
            
            // App State
            const [isAuthenticated, setIsAuthenticated] = useState(false); 
            const [activeTab, setActiveTab] = useState('home');
            const [classes, setClasses] = useState(INITIAL_CLASSES);
            const [bookedClasses, setBookedClasses] = useState([1]); 
            const [showPaymentModal, setShowPaymentModal] = useState(false);
            
            // Admin Mobile Menu State
            const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

            // AI Chat State
            const [chatMessages, setChatMessages] = useState([
                { role: 'ai', text: 'Namaste! I am your FitSphere AI coach. How can we crush your goals today?' }
            ]);
            const [chatInput, setChatInput] = useState('');
            const [isAiTyping, setIsAiTyping] = useState(false);

            // Handlers
            const handleBookClass = (classId) => {
                const isCurrentlyBooked = bookedClasses.includes(classId);
                const targetClass = classes.find(c => c.id === classId);

                if (isCurrentlyBooked) {
                    setBookedClasses(prev => prev.filter(id => id !== classId));
                    setClasses(prev => prev.map(c => c.id === classId ? { ...c, spots: c.spots + 1 } : c));
                } else if (targetClass && targetClass.spots > 0) {
                    setBookedClasses(prev => [...prev, classId]);
                    setClasses(prev => prev.map(c => c.id === classId ? { ...c, spots: c.spots - 1 } : c));
                }
            };

            const handleSendMessage = async (e) => {
                e.preventDefault();
                if (!chatInput.trim()) return;
                
                const userInput = chatInput;
                setChatMessages(prev => [...prev, { role: 'user', text: userInput }]);
                setChatInput('');
                setIsAiTyping(true);

                try {
                    const apiKey = ""; // The execution environment provides the key at runtime
                    
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: userInput }] }],
                            systemInstruction: { 
                                parts: [{ text: "You are an energetic, helpful AI fitness coach for FitSphere gym in India. Keep answers concise, motivating, and culturally relevant to India (e.g., mention Indian diets like Dal, Paneer, etc. when asked about food). Keep responses under 3 sentences. Do not use markdown." }] 
                            }
                        })
                    });

                    const data = await response.json();
                    
                    if (data.candidates && data.candidates.length > 0) {
                        const aiResponse = data.candidates[0].content.parts[0].text;
                        setChatMessages(prev => [...prev, { role: 'ai', text: aiResponse }]);
                    } else {
                        throw new Error("Invalid response format");
                    }
                } catch (error) {
                    console.error("AI Error:", error);
                    // Fallback simulated response just in case the API call fails
                    let fallbackResponse = "Keep pushing! Make sure to stay hydrated during your workout.";
                    if (userInput.toLowerCase().includes('diet')) fallbackResponse = "For muscle gain, aim for high protein. Try adding paneer, dal, soya chunks, or chicken to your daily meals!";
                    setChatMessages(prev => [...prev, { role: 'ai', text: fallbackResponse }]);
                } finally {
                    setIsAiTyping(false);
                }
            };

            // ================= LOGIN & REGISTRATION =================
            // Using functions returning JSX to prevent re-mounting and losing input focus
            const [loginStep, setLoginStep] = useState('phone'); 
            const [phoneNumber, setPhoneNumber] = useState('');

            const renderLoginScreen = () => {
                return (
                    <div className="h-full w-full bg-gray-900 flex flex-col items-center justify-center p-6 text-white fade-in relative overflow-hidden">
                        <div className="absolute top-0 right-0 -mr-20 -mt-20 w-64 h-64 rounded-full bg-indigo-600 opacity-20 blur-3xl"></div>
                        <div className="absolute bottom-0 left-0 -ml-20 -mb-20 w-64 h-64 rounded-full bg-pink-600 opacity-20 blur-3xl"></div>
                        
                        <div className="z-10 w-full max-w-sm">
                            <div className="text-center mb-10">
                                <div className="w-20 h-20 bg-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg shadow-indigo-500/50">
                                    <i className="fas fa-dumbbell text-4xl text-white"></i>
                                </div>
                                <h1 className="text-3xl font-bold tracking-wide">FitSphere</h1>
                                <p className="text-gray-400 mt-2 text-sm">Your fitness journey begins here</p>
                            </div>

                            {loginStep === 'phone' ? (
                                <div className="space-y-5 fade-in">
                                    <div>
                                        <label className="text-xs text-gray-400 uppercase tracking-wider font-semibold mb-2 block">Mobile Number</label>
                                        <div className="flex bg-gray-800 rounded-xl border border-gray-700 overflow-hidden focus-within:border-indigo-500 transition">
                                            <span className="px-4 py-3 bg-gray-800 text-gray-400 border-r border-gray-700 font-medium">+91</span>
                                            <input 
                                                type="tel" 
                                                className="flex-1 bg-transparent px-4 py-3 text-white outline-none w-full" 
                                                placeholder="Enter 10-digit number"
                                                value={phoneNumber}
                                                onChange={(e) => setPhoneNumber(e.target.value)}
                                            />
                                        </div>
                                    </div>
                                    <button 
                                        onClick={() => setLoginStep('otp')} 
                                        className="w-full bg-indigo-600 hover:bg-indigo-700 py-3.5 rounded-xl font-bold transition shadow-lg shadow-indigo-600/30"
                                    >
                                        Get OTP
                                    </button>

                                    <div className="relative flex items-center py-4">
                                        <div className="flex-grow border-t border-gray-700"></div>
                                        <span className="flex-shrink-0 mx-4 text-gray-500 text-xs uppercase tracking-wider">Or</span>
                                        <div className="flex-grow border-t border-gray-700"></div>
                                    </div>

                                    <button 
                                        onClick={() => setIsAuthenticated(true)} 
                                        className="w-full bg-white text-gray-900 hover:bg-gray-100 py-3.5 rounded-xl font-bold transition flex items-center justify-center gap-3"
                                    >
                                        <img src="https://cdn1.iconfinder.com/data/icons/google-s-logo/150/Google_Icons-09-512.png" alt="Google" className="w-5 h-5" />
                                        Continue with Google
                                    </button>
                                </div>
                            ) : (
                                <div className="space-y-5 fade-in text-center">
                                    <p className="text-sm text-gray-400 mb-6">We've sent a 4-digit code to<br/><strong className="text-white">+91 {phoneNumber || '9876543210'}</strong></p>
                                    
                                    <div className="flex gap-3 justify-center mb-6">
                                        {[1, 2, 3, 4].map(i => (
                                            <input 
                                                key={i} 
                                                type="text" 
                                                maxLength="1" 
                                                className="w-14 h-14 bg-gray-800 border border-gray-700 rounded-xl text-center text-2xl font-bold text-white outline-none focus:border-indigo-500 focus:bg-gray-700 transition" 
                                            />
                                        ))}
                                    </div>

                                    <button 
                                        onClick={() => setIsAuthenticated(true)} 
                                        className="w-full bg-indigo-600 hover:bg-indigo-700 py-3.5 rounded-xl font-bold transition shadow-lg shadow-indigo-600/30"
                                    >
                                        Verify & Login
                                    </button>
                                    
                                    <button 
                                        onClick={() => setLoginStep('phone')} 
                                        className="text-gray-400 hover:text-white text-sm mt-4 inline-block"
                                    >
                                        <i className="fas fa-arrow-left mr-1"></i> Change Number
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // ================= PAYMENT MODAL =================
            const [payStep, setPayStep] = useState('select'); 
            const renderPaymentModal = () => {
                return (
                    <div className="fixed inset-0 bg-black/60 z-[100] flex items-end sm:items-center justify-center sm:p-4 backdrop-blur-sm fade-in">
                        <div className="bg-white rounded-t-3xl sm:rounded-3xl w-full sm:max-w-md overflow-hidden shadow-2xl">
                            {payStep === 'select' && (
                                <div className="p-6">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="text-xl font-bold text-gray-900">Choose Membership</h3>
                                        <button onClick={() => setShowPaymentModal(false)} className="text-gray-400 hover:text-gray-600 w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center">
                                            <i className="fas fa-times"></i>
                                        </button>
                                    </div>
                                    <div className="space-y-4 mb-8">
                                        <div className="border-2 border-indigo-600 bg-indigo-50 rounded-2xl p-4 cursor-pointer relative shadow-sm">
                                            <div className="absolute -top-3 right-4 bg-indigo-600 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-wider">Most Popular</div>
                                            <div className="flex justify-between items-center">
                                                <div>
                                                    <h4 className="font-bold text-gray-900 text-lg">Pro Elite</h4>
                                                    <p className="text-xs text-indigo-600 font-semibold mt-0.5">6 Months Access</p>
                                                </div>
                                                <div className="text-right">
                                                    <h4 className="font-bold text-indigo-600 text-xl">₹14,999</h4>
                                                    <p className="text-xs text-gray-400 line-through">₹18,000</p>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="border border-gray-200 rounded-2xl p-4 cursor-pointer hover:border-indigo-300 transition">
                                            <div className="flex justify-between items-center">
                                                <div>
                                                    <h4 className="font-bold text-gray-900">Basic Flex</h4>
                                                    <p className="text-xs text-gray-500 mt-0.5">1 Month Access</p>
                                                </div>
                                                <h4 className="font-bold text-gray-900 text-lg">₹2,999</h4>
                                            </div>
                                        </div>
                                    </div>
                                    
                                    <p className="text-xs text-gray-400 text-center mb-3"><i className="fas fa-lock mr-1"></i> Secured by FitSphere Payments</p>
                                    <button 
                                        onClick={() => { setPayStep('processing'); setTimeout(() => setPayStep('success'), 2500); }} 
                                        className="w-full bg-gray-900 text-white py-4 rounded-xl font-bold flex items-center justify-center gap-2 hover:bg-gray-800 transition shadow-lg"
                                    >
                                        Pay via UPI / Card <i className="fas fa-arrow-right"></i>
                                    </button>
                                </div>
                            )}

                            {payStep === 'processing' && (
                                <div className="p-12 text-center flex flex-col items-center">
                                    <div className="w-16 h-16 border-4 border-indigo-100 border-t-indigo-600 rounded-full animate-spin mb-6"></div>
                                    <h3 className="text-lg font-bold text-gray-900">Processing Payment...</h3>
                                    <p className="text-sm text-gray-500 mt-2">Connecting to secure gateway. Please don't close this screen.</p>
                                </div>
                            )}

                            {payStep === 'success' && (
                                <div className="p-10 text-center flex flex-col items-center fade-in">
                                    <div className="w-20 h-20 bg-green-100 text-green-500 rounded-full flex items-center justify-center text-4xl mb-6 shadow-inner">
                                        <i className="fas fa-check"></i>
                                    </div>
                                    <h3 className="text-2xl font-bold text-gray-900">Payment Successful!</h3>
                                    <p className="text-sm text-gray-500 mt-2 mb-8">Your membership has been instantly activated. Time to sweat!</p>
                                    <button 
                                        onClick={() => { setShowPaymentModal(false); setPayStep('select'); }} 
                                        className="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-xl font-bold transition shadow-lg shadow-indigo-600/30"
                                    >
                                        Let's Go
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // ================= USER MOBILE APP RENDER FUNCTIONS =================
            const renderUserHome = () => (
                <div className="p-6 space-y-6 pb-24 h-full overflow-y-auto bg-gray-50 fade-in">
                    <div className="flex justify-between items-center">
                        <div>
                            <h1 className="text-2xl font-bold text-gray-900">Hi, Rahul! 👋</h1>
                            <p className="text-sm text-gray-500">Ready to sweat today?</p>
                        </div>
                        <div className="h-12 w-12 rounded-full bg-indigo-100 flex items-center justify-center border-2 border-indigo-500 overflow-hidden">
                            <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Rahul" alt="avatar" />
                        </div>
                    </div>

                    <div className="bg-gradient-to-r from-gray-900 to-indigo-900 rounded-3xl p-6 text-white shadow-xl relative overflow-hidden">
                        <div className="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-white opacity-5"></div>
                        <div className="flex justify-between items-start mb-6 relative z-10">
                            <div>
                                <p className="text-indigo-200 text-sm font-medium tracking-wider uppercase mb-1">Membership</p>
                                <h2 className="text-2xl font-bold">Pro Elite</h2>
                            </div>
                            <button onClick={() => setShowPaymentModal(true)} className="bg-indigo-500/40 hover:bg-indigo-500/60 px-3 py-1.5 rounded-full border border-indigo-400/50 transition flex items-center gap-1 cursor-pointer backdrop-blur-sm">
                                <i className="fas fa-bolt text-[10px] text-yellow-400"></i>
                                <span className="text-xs font-semibold">Renew Plan</span>
                            </button>
                        </div>
                        
                        <div className="grid grid-cols-3 gap-4 mb-2 relative z-10">
                            <div className="text-center">
                                <p className="text-3xl font-bold">12</p>
                                <p className="text-xs text-indigo-200">Workouts</p>
                            </div>
                            <div className="text-center border-l border-r border-indigo-700/50">
                                <p className="text-3xl font-bold">3</p>
                                <p className="text-xs text-indigo-200">Streak</p>
                            </div>
                            <div className="text-center flex flex-col items-center justify-center">
                                <button onClick={() => setActiveTab('qr')} className="bg-white text-indigo-900 w-10 h-10 rounded-full hover:scale-105 transition shadow-lg flex items-center justify-center">
                                    <i className="fas fa-qrcode"></i>
                                </button>
                                <p className="text-[10px] mt-1 text-indigo-200 font-medium">Check-in</p>
                            </div>
                        </div>
                    </div>

                    <div>
                        <h3 className="font-semibold text-gray-900 mb-3">Quick Actions</h3>
                        <div className="grid grid-cols-4 gap-3">
                            {[
                                { icon: 'fa-dumbbell', label: 'Workouts', color: 'text-orange-500', bg: 'bg-orange-100' },
                                { icon: 'fa-tint', label: 'Diet Plan', color: 'text-blue-500', bg: 'bg-blue-100' },
                                { icon: 'fa-heartbeat', label: 'Body Stats', color: 'text-purple-500', bg: 'bg-purple-100' },
                                { icon: 'fa-play', label: 'Live Video', color: 'text-red-500', bg: 'bg-red-100' },
                            ].map((action, idx) => (
                                <div key={idx} className="flex flex-col items-center gap-2">
                                    <div className={`h-14 w-14 rounded-2xl ${action.bg} flex items-center justify-center cursor-pointer hover:scale-105 transition`}>
                                        <i className={`fas ${action.icon} ${action.color} text-xl`}></i>
                                    </div>
                                    <span className="text-xs font-medium text-gray-600">{action.label}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    {bookedClasses.length > 0 && (
                        <div>
                            <h3 className="font-semibold text-gray-900 mb-3">Upcoming Today</h3>
                            {bookedClasses.map(id => {
                                const cls = classes.find(c => c.id === id);
                                if(!cls) return null;
                                return (
                                    <div key={id} className="bg-white rounded-2xl p-4 shadow-sm border border-gray-100 flex items-center justify-between mb-3 fade-in">
                                        <div className="flex items-center gap-4">
                                            <div className={`${cls.color} h-12 w-12 rounded-xl flex items-center justify-center text-white shadow-md`}>
                                                <i className="fas fa-clock text-xl"></i>
                                            </div>
                                            <div>
                                                <h4 className="font-bold text-gray-900">{cls.name}</h4>
                                                <p className="text-sm text-gray-500">{cls.time} • {cls.duration}</p>
                                            </div>
                                        </div>
                                        <span className="text-green-600 bg-green-50 px-3 py-1 rounded-full text-xs font-bold border border-green-100">
                                            Booked ✓
                                        </span>
                                    </div>
                                );
                            })}
                        </div>
                    )}
                </div>
            );

            const renderUserClasses = () => (
                <div className="h-full flex flex-col bg-gray-50 pb-20 fade-in">
                    <div className="p-6 pb-2 bg-white shadow-sm z-10">
                        <h1 className="text-2xl font-bold text-gray-900 mb-4">Book a Class</h1>
                        <div className="flex gap-3 overflow-x-auto pb-4 scrollbar-hide">
                            {['Today', 'Tomorrow', 'Wed 12', 'Thu 13', 'Fri 14'].map((day, idx) => (
                                <div key={idx} className={`min-w-[80px] py-3 rounded-2xl flex flex-col items-center justify-center cursor-pointer transition ${idx === 0 ? 'bg-indigo-600 text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}`}>
                                    <span className={`text-xs ${idx === 0 ? 'text-indigo-200' : 'text-gray-400'}`}>May</span>
                                    <span className="font-bold">{day.includes(' ') ? day.split(' ')[1] : (idx === 0 ? '10' : '11')}</span>
                                </div>
                            ))}
                        </div>
                    </div>

                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                        {classes.map((cls) => {
                            const isBooked = bookedClasses.includes(cls.id);
                            const isFull = cls.spots === 0 && !isBooked;

                            return (
                                <div key={cls.id} className={`bg-white rounded-2xl p-5 shadow-sm border border-gray-100 relative overflow-hidden transition-all ${isBooked ? 'ring-2 ring-indigo-500' : ''}`}>
                                    <div className={`absolute top-0 left-0 w-1.5 h-full ${cls.color}`}></div>
                                    <div className="flex justify-between items-start mb-3 pl-2">
                                        <div>
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="text-xs font-bold tracking-wider uppercase text-gray-400">{cls.type}</span>
                                                {cls.spots <= 5 && cls.spots > 0 && !isBooked && (
                                                    <span className="bg-red-100 text-red-600 text-[10px] font-bold px-2 py-0.5 rounded-sm">Fast Filling</span>
                                                )}
                                            </div>
                                            <h3 className="text-xl font-bold text-gray-900">{cls.name}</h3>
                                        </div>
                                        <div className="text-right">
                                            <p className="text-lg font-bold text-indigo-600">{cls.time}</p>
                                            <p className="text-xs text-gray-500">{cls.duration}</p>
                                        </div>
                                    </div>
                                    <div className="flex items-center gap-2 mb-4 pl-2">
                                        <div className="h-6 w-6 rounded-full bg-gray-200 overflow-hidden">
                                            <img src={`https://api.dicebear.com/7.x/avataaars/svg?seed=${cls.instructor}`} alt={cls.instructor} />
                                        </div>
                                        <span className="text-sm text-gray-600 font-medium">{cls.instructor}</span>
                                    </div>
                                    <div className="flex justify-between items-center pl-2 pt-4 border-t border-gray-50">
                                        <div className="flex items-center gap-1.5">
                                            <i className={`fas fa-users ${isFull ? 'text-red-400' : 'text-gray-400'}`}></i>
                                            <span className={`text-sm font-medium ${isFull ? 'text-red-500' : 'text-gray-600'}`}>
                                                {isBooked ? 'Spot Confirmed' : `${cls.spots} spots left`}
                                            </span>
                                        </div>
                                        <button 
                                            onClick={() => handleBookClass(cls.id)}
                                            disabled={isFull}
                                            className={`px-6 py-2 rounded-xl font-semibold transition ${
                                                isBooked ? 'bg-indigo-50 text-indigo-700 border border-indigo-200' : 
                                                isFull ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 
                                                'bg-gray-900 text-white hover:bg-indigo-600 shadow-md shadow-gray-300'
                                            }`}
                                        >
                                            {isBooked ? 'Cancel' : isFull ? 'Waitlist' : 'Book Now'}
                                        </button>
                                    </div>
                                </div>
                            );
                        })}
                    </div>
                </div>
            );

            const renderUserAICoach = () => (
                <div className="h-full flex flex-col bg-gray-50 pb-20 fade-in">
                    <div className="p-4 bg-white shadow-sm flex items-center gap-3 z-10 border-b border-gray-100">
                        <div className="h-10 w-10 bg-gradient-to-tr from-indigo-500 to-purple-500 rounded-full flex items-center justify-center text-white shadow-md">
                            <i className="fas fa-bolt"></i>
                        </div>
                        <div>
                            <h2 className="font-bold text-gray-900 text-lg">FitSphere AI</h2>
                            <p className="text-xs text-indigo-600 font-medium flex items-center gap-1">
                                <span className="w-1.5 h-1.5 bg-green-500 rounded-full inline-block"></span> Online
                            </p>
                        </div>
                    </div>
                    <div className="flex-1 overflow-y-auto p-4 space-y-4">
                        {chatMessages.map((msg, idx) => (
